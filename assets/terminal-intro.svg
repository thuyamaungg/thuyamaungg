<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Terminal session showing the three project test suites running and passing.">
<defs>
  <linearGradient id="bgTi" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050A12"/><stop offset="100%" stop-color="#07141F"/>
  </linearGradient>
  <pattern id="gTi" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#5B8CFF" stroke-opacity=".05"/>
  </pattern>
  <linearGradient id="swTi" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3DD6C4" stop-opacity="0"/>
    <stop offset="50%" stop-color="#3DD6C4" stop-opacity=".4"/>
    <stop offset="1" stop-color="#3DD6C4" stop-opacity="0"/>
  </linearGradient>
  <style>
    .m{font:400 14px ui-monospace,Consolas,monospace}
    .hd{font:700 11px ui-monospace,Consolas,monospace;fill:#6FE3D4;letter-spacing:1.5px}
    .ln{opacity:0;animation:in .4s ease forwards}
    .r1{animation-delay:.3s}.r2{animation-delay:.9s}.r3{animation-delay:1.4s}.r4{animation-delay:2.0s}
    .r5{animation-delay:2.5s}.r6{animation-delay:3.1s}.r7{animation-delay:3.6s}.r8{animation-delay:4.2s}
    .r9{animation-delay:4.7s}
    @keyframes in{to{opacity:1}}
    .cur{animation:bk 1s steps(2) infinite}
    @keyframes bk{0%,49%{opacity:1}50%,100%{opacity:0}}
    .sw{animation:swy 7s linear infinite}
    @keyframes swy{0%{transform:translateY(-20px)}100%{transform:translateY(360px)}}
    .dotp{animation:dp 2s ease-in-out infinite}
    @keyframes dp{0%,100%{opacity:.45}50%{opacity:1}}
  </style>
</defs>
<rect width="1200" height="340" rx="22" fill="url(#bgTi)"/>
<rect width="1200" height="340" rx="22" fill="url(#gTi)"/>
<rect class="sw" width="1200" height="2" fill="url(#swTi)"/>

<circle class="dotp" cx="48" cy="40" r="6" fill="#FFA24D"/>
<circle cx="68" cy="40" r="6" fill="#22303F"/>
<circle cx="88" cy="40" r="6" fill="#22303F"/>
<text class="hd" x="112" y="45">thuyamaungg@workbench — three systems, all green</text>
<line x1="34" y1="64" x2="1166" y2="64" stroke="#5B8CFF" stroke-opacity=".14"/>

<g class="m">
  <text class="ln r1" x="48" y="98"><tspan fill="#3DD6C4">$</tspan> <tspan fill="#E4EBF5">cd ticket-triage-agent &amp;&amp; pytest -q</tspan></text>
  <text class="ln r2" x="48" y="124" fill="#3DD6C4">145 passed <tspan fill="#65748C">in 11.39s — no network calls</tspan></text>

  <text class="ln r3" x="48" y="162"><tspan fill="#3DD6C4">$</tspan> <tspan fill="#E4EBF5">cd ../wisp-monitoring-assistant &amp;&amp; python wisp_rag.py eval</tspan></text>
  <text class="ln r4" x="48" y="188" fill="#3DD6C4">20/21 passing <tspan fill="#65748C">— 164 chunks indexed, 0 API keys</tspan></text>

  <text class="ln r5" x="48" y="226"><tspan fill="#3DD6C4">$</tspan> <tspan fill="#E4EBF5">cd ../burmese-pc-chatbot &amp;&amp; pytest --cov</tspan></text>
  <text class="ln r6" x="48" y="252" fill="#3DD6C4">169 passed <tspan fill="#65748C">— 92% backend coverage</tspan></text>

  <text class="ln r7" x="48" y="290"><tspan fill="#3DD6C4">$</tspan> <tspan fill="#E4EBF5">git log --oneline | wc -l</tspan></text>
  <text class="ln r8" x="48" y="316" fill="#65748C">still counting<tspan fill="#FFA24D"> — twenty years of fixing things came first</tspan></text>
  <rect class="cur ln r9" x="48" y="304" width="8" height="15" fill="#3DD6C4"/>
</g>
<rect x="1" y="1" width="1198" height="338" rx="22" fill="none" stroke="#7FA8E0" stroke-opacity=".16"/>
</svg>
