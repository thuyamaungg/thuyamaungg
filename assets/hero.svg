<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Thuya Maung — network engineer building AI systems" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070C16"/>
    <stop offset="55%" stop-color="#05080F"/>
    <stop offset="100%" stop-color="#081420"/>
  </linearGradient>
  <radialGradient id="glowA" cx="50%" cy="50%">
    <stop offset="0" stop-color="#1E4FB8" stop-opacity=".55"/>
    <stop offset="1" stop-color="#1E4FB8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="50%" cy="50%">
    <stop offset="0" stop-color="#0E7E76" stop-opacity=".5"/>
    <stop offset="1" stop-color="#0E7E76" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3DD6C4" stop-opacity="0"/>
    <stop offset="50%" stop-color="#3DD6C4" stop-opacity=".5"/>
    <stop offset="1" stop-color="#3DD6C4" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#5B8CFF" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
  <clipPath id="frame"><rect x="0" y="0" width="1200" height="320" rx="22"/></clipPath>
  <clipPath id="typeClip"><rect id="typeRect" x="726" y="150" width="0" height="26"/></clipPath>
  <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
</defs>

<style>
  .fade{opacity:0;animation:fade .9s ease forwards}
  .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}
  @keyframes fade{to{opacity:1}}

  .blobA{animation:driftA 17s ease-in-out infinite}
  .blobB{animation:driftB 21s ease-in-out infinite}
  @keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(44px,22px)}}
  @keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-52px,18px)}}

  .sweep{animation:sweepY 6.5s linear infinite}
  @keyframes sweepY{0%{transform:translateY(-40px)}100%{transform:translateY(360px)}}

  .wire{stroke-dasharray:7 9;animation:march 2.6s linear infinite}
  @keyframes march{to{stroke-dashoffset:-32}}

  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .p2{animation-delay:.5s}.p3{animation-delay:1s}.p4{animation-delay:1.5s}
  @keyframes pulse{0%,100%{opacity:.4;r:3.5}50%{opacity:1;r:5}}

  #typeRect{animation:type 3.4s steps(22) infinite}
  @keyframes type{0%{width:0}55%{width:300px}92%{width:300px}100%{width:0}}

  .caret{animation:blink 1s steps(2) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  .name{font:700 52px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#E9EFF8;letter-spacing:-1.6px}
  .role{font:400 19px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#93A3BC}
  .tag{font:600 12px ui-monospace,'Cascadia Code',Consolas,monospace;fill:#3DD6C4;letter-spacing:1.4px}
  .mono{font:400 15px ui-monospace,'Cascadia Code',Consolas,monospace}
  .lbl{font:400 11px ui-monospace,'Cascadia Code',Consolas,monospace;fill:#65748C}
</style>

<g clip-path="url(#frame)">
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <ellipse class="blobA" cx="180" cy="80" rx="320" ry="220" fill="url(#glowA)"/>
  <ellipse class="blobB" cx="1010" cy="250" rx="300" ry="210" fill="url(#glowB)"/>
  <rect class="sweep" x="0" y="0" width="1200" height="2" fill="url(#sweep)"/>

  <!-- left: identity -->
  <g class="fade d1">
    <text class="tag" x="64" y="96">NETWORK ENGINEER · AI DEVELOPER</text>
  </g>
  <text class="name fade d2" x="62" y="156">Thuya Maung</text>
  <g class="fade d3">
    <text class="role" x="64" y="194">Twenty years keeping networks and hardware</text>
    <text class="role" x="64" y="220">running. Now building the systems that support them.</text>
  </g>

  <!-- left: small wired nodes -->
  <g class="fade d4" transform="translate(64,258)">
    <path class="wire" d="M8 8 H 132" stroke="#5B8CFF" stroke-width="1.5" fill="none"/>
    <path class="wire" d="M148 8 H 272" stroke="#3DD6C4" stroke-width="1.5" fill="none"/>
    <circle class="pulse" cx="8" cy="8" r="4" fill="#5B8CFF"/>
    <circle class="pulse p2" cx="140" cy="8" r="4" fill="#3DD6C4"/>
    <circle class="pulse p3" cx="280" cy="8" r="4" fill="#FFA24D"/>
    <text class="lbl" x="300" y="12">python · fastapi · rag · agents · docker</text>
  </g>

  <!-- right: terminal -->
  <g class="fade d3">
    <rect x="700" y="72" width="444" height="176" rx="16" fill="#0A1120" fill-opacity=".92" stroke="#5B8CFF" stroke-opacity=".22"/>
    <circle cx="726" cy="100" r="5.5" fill="#FFA24D"/>
    <circle cx="746" cy="100" r="5.5" fill="#22303F"/>
    <circle cx="766" cy="100" r="5.5" fill="#22303F"/>
    <text class="mono" x="1042" y="104" fill="#3F4C60">zsh</text>
    <line x1="700" y1="120" x2="1144" y2="120" stroke="#5B8CFF" stroke-opacity=".14"/>

    <text class="mono" x="726" y="152" fill="#3DD6C4">$</text>
    <g clip-path="url(#typeClip)">
      <text class="mono" x="744" y="152" fill="#E9EFF8">pytest -q</text>
    </g>
    <rect class="caret" x="746" y="139" width="8" height="15" fill="#3DD6C4"/>

    <text class="mono" x="726" y="182" fill="#3DD6C4">145 passed</text>
    <text class="mono" x="836" y="182" fill="#65748C">in 11.39s</text>
    <text class="mono" x="726" y="212" fill="#65748C">eval</text>
    <text class="mono" x="776" y="212" fill="#3DD6C4">20/21</text>
    <text class="mono" x="846" y="212" fill="#65748C">coverage</text>
    <text class="mono" x="938" y="212" fill="#3DD6C4">92%</text>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="22" fill="none" stroke="#7FA8E0" stroke-opacity=".18"/>
</g>
</svg>
